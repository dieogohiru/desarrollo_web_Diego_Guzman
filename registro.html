<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DCC - Registro</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="navbar">
        <h1>Registro</h1>
        <nav>
            <a class="navbar-page" href="index.html">Volver al Menú Principal</a>
        </nav>
    </header>

    <main class="container">
        <form class="formulario" id="form-miembro">
            <header>
                <h2>Registrar Miembro</h2>
                <p><small>(*) Campos obligatorios</small></p>
            </header>
            
            <div class="grupo-input">
                <label for="nombre">Nombre (*)</label>
                <input id="nombre" type="text" placeholder="Ejemplo: Pedro Pablo">
            </div>

            <div class="grupo-input">
                <label for="email">Email (*)</label>
                <input id="email" type="email" placeholder="Ejemplo: pedro.p@ug.uchile.cl">
            </div>

            <div class="grupo-input">
                <label for="telefono">Número Personal (*)</label>
                <div class="input-prefijo">
                    <span>+56 9</span>
                    <input id="telefono" type="text" maxlength="8" placeholder="12345678">
                </div>
            </div>

            <div class="grupo-input">
                <label for="tipo">Tipo de Miembro (*)</label>
                <select id="tipo" onchange="actualizarcasillas()">
                    <option value="">Seleccione...</option>
                    <option value="estudiante_pre">Estudiante de Pregrado</option>
                    <option value="estudiante_post">Estudiante de Postgrado</option>
                    <option value="funcionario">Funcionario(a)</option>
                    <option value="academico">Académico(a)</option>
                </select>
            </div>

            <div id="contenedor-dinamico"></div>
            
            <footer>
                <button type="button" onclick="validarMiembro()">Siguiente Paso</button>
            </footer>
        </form>

        <form class="formulario" id="form-actividad" style="display: none;">
            <header>
                <h2>Detalles de la Actividad</h2>
            </header>

            <div class="grupo-input">
                <label for="tipo-act">Categoría de Actividad (*)</label>
                <select id="tipo-act">
                    <option value="">Seleccione...</option>
                    <option value="artistica">Artística</option>
                    <option value="deportiva">Deportiva</option>
                    <option value="tecnologica">Tecnológica</option>
                    <option value="social">Social</option>
                    <option value="recreativa">Recreativa</option>
                </select>
            </div>

            <div class="grupo-input">
                <label for="nombre-especifico">Nombre de la Actividad (*)</label>
                <input id="nombre-especifico" type="text" placeholder="Ejemplo: Taller de Robótica">
            </div>

            <div class="grupo-input">
                <label for="horarios">Horarios donde la realiza (*)</label>
                <input id="horarios" type="text" placeholder="Ejemplo: Lunes de las 14:00 hasta 15:30">
            </div>

            <div class="grupo-input">
                <label for="archivos">Subir video/imagen de usted en la actividad (*)</label>
                <input id="archivos" type="file">
            </div>

            <div class="grupo-input">
                <label for="enlace">Enlace de Interés (*)</label>
                <input id="enlace" type="url" placeholder="https://ejemplo.cl">
            </div>

            <footer>
                <button type="button" onclick="validarActividad()">Finalizar Registro</button>
            </footer>
        </form>
    </main>

    <script src="validador.js"></script>
</body>
</html>
